# pzt settings for Build Ahead's single-player in-game test (bash syntax, sourced by pzt).
# Lua-only mod: no BUILD, no LOGIC_JARS. The test Lua is installed only into the test env.
MOD_SRC="Contents/mods"
MODS="BuildAhead"
TEST_FILES=("tests/BuildAhead_Test.lua BuildAhead/42/media/lua/client/" "tests/BuildAhead_Test2.lua BuildAhead/42/media/lua/client/")
# a small sandbox save with room to build around the player (copied fresh every run)
SAVE="$PROJECT/tests/save/Sandbox/2026-10-18_00-11-37"
LOG_GREP='\[BuildAhead(Test2?)?\]'
# the test drives itself (OnRenderTick phases); BuildAheadTest.poll() keeps the script
# alive until the test is done, then the harness logs "done" and quits
STEPS=(
  "lua BuildAheadTest.start()"
  "lua BuildAheadTest.poll()"
  "lua BuildAheadTest2.start()"
  "lua BuildAheadTest2.poll()"
)
TIMEOUT=1500
